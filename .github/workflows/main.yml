name: Build home-server

on:
  # Trigger Gradle build and Sonar analysis when pushing in main or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Echo (debug) action details
        uses: hmarr/debug-action@v3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Verify Sonar token presence
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is empty in this run context"
            exit 1
          fi
          echo "SONAR_TOKEN is present"

      - name: Echo PR metadata (debug)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.event.pull_request.base.repo.full_name }}"
          echo "is_fork=${{ github.event.pull_request.head.repo.fork }}"

      - name: Run tests and Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)) }}
        run: ./gradlew --no-daemon build sonar
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
