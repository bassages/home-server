name: Build home-server

on:
  # Trigger Gradle build and Sonar analysis when pushing in main or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Echo (debug) action details
        uses: hmarr/debug-action@v3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Run tests and build
        run: ./gradlew --no-daemon build

      # Repository Actions secrets are not available to fork PRs. Dependabot uses
      # separate secrets and should not be allowed to block dependency-update PRs
      # with an unauthorized SonarCloud analysis.
      - name: Run Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]')) }}
        run: ./gradlew --no-daemon sonar
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
